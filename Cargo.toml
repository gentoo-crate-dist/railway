[package]
name = "diebahn"
description = "Find all your travel information" # keep in sync with metainfo
authors = ["Julian Schmidhuber <mobile@schmidhuberj.de>", "Markus Göllnitz <camelcasenick@bewares.it>"]
homepage = "https://mobile.schmidhuberj.de/railway"
repository = "https://gitlab.com/schmiddi-on-mobile/railway"
version = "2.10.1"
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
gtk = { version = "0.10", package = "gtk4", features = ["v4_14"] }
gdk = { version = "0.10", package = "gdk4" }
libadwaita = { version = "0.8", features = ["v1_7"] }
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }

once_cell = "1.21.4"
tokio = { version = "1.52.2", features = ["rt", "macros", "rt-multi-thread", "time"] }
chrono = "0.4.44"
chrono-tz = "0.10"

log = "0.4.29"
env_logger = "0.11.10"

rcore = { package = "railway-core", version = "0.3.0", features = ["reqwest-requester", "rt-multi-thread", "serde"] }
rapi = { package = "railway-api", version = "0.3.0", features = ["rt-multi-thread"] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
